services:
  telegram-ai-bot:
    build: .
    container_name: telegram-ai-companion
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/bot.db
      HEARTBEAT_PATH: /tmp/bot-heartbeat
    volumes:
      - bot_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    init: true
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
